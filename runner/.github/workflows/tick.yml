name: tick
# A second, independent clock for Milestone (V2_PLAN principle P5): every 5 minutes it calls the public,
# idempotent /api/tick, which moves deadlines on (releases, lock windows, arbitrator deadlines) and delivers
# platform webhooks. cron-job.org is the other clock; either can stop without anything breaking.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Tick
        run: curl -sS --max-time 180 -o /dev/null -w "tick: HTTP %{http_code} in %{time_total}s\n" https://milestone-ai-escrow.onrender.com/api/tick || true
